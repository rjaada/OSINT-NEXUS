name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: osint_test
          POSTGRES_USER: osint
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U osint -d osint_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t osint-backend backend

      - name: Build frontend image
        run: |
          docker build --target builder -t osint-frontend-tests frontend
          docker run --rm osint-frontend-tests sh -c "npm run lint && npm test && npx tsc --noEmit"
          docker build -t osint-frontend frontend

      - name: Run backend test suite
        run: |
          docker run --rm --network host \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_USER=osint \
            -e POSTGRES_PASSWORD=ci_test_password \
            -e POSTGRES_DB=osint_test \
            -e NEO4J_PASSWORD=ci_test_password \
            -e AUTH_SECRET=ci-test-secret-at-least-32-chars-long \
            -e AUTH_DEFAULT_ADMIN_PASSWORD=CiTestPass123! \
            -e AUTH_COOKIE_SECURE=0 \
            -w /app \
            osint-backend \
            python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test media hooks
        run: |
          docker build -t osint-media-hooks backend/hooks_local
          docker run --rm -v "$PWD/backend/hooks_local:/app:ro" osint-media-hooks python -m unittest test_app -v

      - name: Test backup scripts
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        if: env.DEPLOY_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /home/${{ secrets.DEPLOY_USER }}/projects/me/OSINT
            git pull origin main
            docker compose build backend frontend
            docker compose up -d backend frontend
