global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: critical
      receiver: 'default'
      repeat_interval: 1h

# Safe local default: alerts remain visible in Prometheus/Grafana without
# attempting delivery to an unconfigured webhook. Deployments can replace this
# receiver with a secret-backed integration-specific configuration.
receivers:
  - name: 'default'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
